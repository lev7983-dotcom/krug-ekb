services:
  - type: web
    name: krug-ekb
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KRUG_ENV
        value: production
      - key: PRIVACY_POLICY_VERSION
        value: 2026-08-16
      - key: TERMS_VERSION
        value: 2026-08-16
      - key: DATA_RESIDENCY_RF_CONFIRMED
        value: "0"
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: LEGAL_OPERATOR_NAME
        sync: false
      - key: LEGAL_OPERATOR_EMAIL
        sync: false
      - key: LEGAL_OPERATOR_ADDRESS
        sync: false
